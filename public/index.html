<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F2742">
  <title>وصول مطالبات امور برق ۲ زاهدان</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login" id="loginScreen" hidden>
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
        </span>
        <div class="brand-text">
          <strong>وصول مطالبات</strong>
          <span>امور برق ۲ زاهدان</span>
        </div>
      </div>
      <h1>ورود به سامانه</h1>
      <p class="sub">برای مشاهده‌ی اطلاعات مشترکین، رمز عبور را وارد کنید.</p>
      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="password">رمز عبور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="login-error" id="loginError" role="alert"></div>
        <button class="btn btn-primary" id="loginBtn" type="submit" style="width:100%">ورود</button>
      </form>
    </div>
  </div>

  <div class="app" id="appShell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>وصول مطالبات</strong>
          <span>امور برق ۲ زاهدان</span>
        </div>
      </div>

      <nav class="nav" aria-label="منوی اصلی">
        <button class="nav-item is-active" data-nav="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>داشبورد</span>
        </button>
        <button class="nav-item" data-nav="regions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span>منطقه</span>
        </button>
        <button class="nav-item" data-nav="roozkars">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
          <span>روزکارها</span>
        </button>
        <button class="nav-item" data-nav="send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></svg>
          <span>ارسال پیامک</span>
        </button>
        <button class="nav-item" data-nav="voice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
          <span>پیامک صوتی</span>
        </button>
        <button class="nav-item" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.4.42.74.79.97.37.23.8.35 1.23.35H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          <span>تنظیمات</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="user">
          <span class="avatar">م</span>
          <div class="user-text">
            <strong>مدیر سامانه</strong>
            <span>محمدرضا آزادمنش</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="باز کردن منو">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="page-title" id="pageTitle">داشبورد</div>
        <div class="topbar-side">
          <button class="btn btn-outline btn-sm topbar-voice" id="voiceSendBtn" aria-label="ارسال پیامک صوتی">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
            <span>ارسال پیامک صوتی</span>
          </button>
          <button class="icon-btn" id="quickSendBtn" aria-label="ارسال پیامک">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></svg>
          </button>
          <span class="status-pill" id="modePill"><span class="dot"></span><span id="modePillText">در حال اتصال…</span></span>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
